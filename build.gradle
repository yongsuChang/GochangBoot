plugins {
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.5'
	id 'java'
	id 'com.github.node-gradle.node' version '7.0.2'
}

group = 'kr.co'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '21'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// AWS Parameter Store
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store:3.1.1'

	// JDBC
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'com.mysql:mysql-connector-j'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
//	runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
	useJUnitPlatform()
}

// Node/pnpm configuration
node {
	version = '20.11.0'
	pnpmVersion = '8.15.0'
	download = true
	workDir = file("${project.projectDir}/.gradle/nodejs")
	pnpmWorkDir = file("${project.projectDir}/.gradle/pnpm")
	nodeProjectDir = file("${project.projectDir}/frontend")
}

// Frontend tasks
task installFrontend(type: com.github.gradle.node.pnpm.task.PnpmTask) {
	args = ['install']
	workingDir = file("${project.projectDir}/frontend")
	dependsOn pnpmSetup
}

task buildFrontend(type: com.github.gradle.node.pnpm.task.PnpmTask) {
	args = ['run', 'build']
	workingDir = file("${project.projectDir}/frontend")
	dependsOn installFrontend
}

task copyFrontend(type: Copy) {
	from "${project.projectDir}/frontend/dist"
	into "${project.buildDir}/resources/main/static"
	dependsOn buildFrontend
}

// Integrate frontend build with Spring Boot build
processResources {
	dependsOn copyFrontend
}

