# /etc/nginx/sites-enabled/default 를 이 내용으로 교체한다 (certbot 이 만든 TLS 설정은 그대로).
# 바뀌는 것: 정적 프론트를 nginx 가 직접 서빙하고, 백엔드에는 /api/ 만 넘긴다.
upstream app_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    server_name gochang-visitor.duckdns.org;

    access_log /var/log/nginx/access.log;

    root /var/www/gochang;          # 프론트 빌드(dist/) 내용이 놓이는 곳
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 민감파일 차단
    location = /.env { return 444; }

    # Vite 는 해시가 붙은 파일명을 만들므로 /assets/ 는 영구 캐시해도 안전하다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 만 백엔드로. actuator 등 그 외 경로는 외부에 노출하지 않는다.
    location /api/ {
        proxy_pass http://app_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  30;
        proxy_send_timeout  30;
    }

    # SPA 라우팅: 파일이 없으면 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gochang-visitor.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gochang-visitor.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = gochang-visitor.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name gochang-visitor.duckdns.org;
    return 404; # managed by Certbot
}
