# 프론트 저장소(GochangBoot-frontend)의 .github/workflows/deploy.yml 로 복사해서 쓴다.
# 빌드 결과(dist/)를 nginx 의 root(/var/www/gochang)로 올린다. 백엔드와 같은 도메인이므로 API URL 은 상대경로 "/api".
name: frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_URL: ""     # 같은 출처이므로 비워 둔다 -> "/api/..." 상대경로로 호출
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: dist/*
          target: /var/www/gochang
          strip_components: 1
