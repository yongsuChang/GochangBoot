name: backend

# 배포를 건너뛰는 방법
#  - 문서/마크다운만 바뀐 push 는 워크플로 자체가 돌지 않는다 (paths-ignore)
#  - 커밋 메시지에 [skip ci] -> 워크플로 전체 생략 (GitHub 기본 기능)
#  - 커밋 메시지에 [skip deploy] -> 테스트만 돌고 배포 생략
#  - 저장소 변수 AUTO_DEPLOY=false -> master push 로는 배포하지 않음 (수동 실행만)
#  - Actions 탭의 Run workflow(workflow_dispatch) 로 원할 때 수동 배포
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'deploy/frontend-deploy.example.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: '테스트 후 서버에 배포'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        with:
          name: gochang-jar
          path: build/libs/gochang.jar
          retention-days: 7

  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/master' && (
        (github.event_name == 'push'
          && vars.AUTO_DEPLOY != 'false'
          && !contains(github.event.head_commit.message, '[skip deploy]'))
        || (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gochang-jar
      # jar 만 올린다. 데이터(/opt/gochang/data)는 서버에 한 번 두는 것이고 배포가 건드리지 않는다.
      # 도커 기반 scp 액션은 전송이 멈추면 무한 대기해서, 러너의 기본 ssh 를 keepalive/타임아웃/재시도와 함께 쓴다.
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CFG
          Host server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ServerAliveInterval 10
            ServerAliveCountMax 3
          CFG
      - name: Upload jar
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout 180 scp -C gochang.jar server:/opt/gochang/incoming/gochang.jar.part && exit 0
            echo "upload attempt $i failed, retrying"; sleep 5
          done
          exit 1
      - name: Swap jar and restart
        timeout-minutes: 3
        run: |
          ssh server 'set -e
            mv /opt/gochang/incoming/gochang.jar.part /opt/gochang/incoming/gochang.jar
            # /opt/gochang 은 gochang 소유라 배포 계정은 sudo 로 옮긴다
            sudo install -o gochang -g gochang -m 644 /opt/gochang/incoming/gochang.jar /opt/gochang/gochang.jar
            rm /opt/gochang/incoming/gochang.jar
            sudo systemctl restart gochang
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:8080/actuator/health && exit 0
              sleep 2
            done
            echo "health check failed"; sudo journalctl -u gochang -n 50 --no-pager; exit 1'
