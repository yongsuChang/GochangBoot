# NAS MySQL -> H2 파일 1회 이전. 웹 서버는 띄우지 않고 복사만 하고 종료한다.
#   MYSQL_URL=jdbc:mysql://<nas-ip>:3306/<db> MYSQL_USER=... MYSQL_PASSWORD=... \
#   java -jar gochang.jar --spring.profiles.active=migrate
spring.main.web-application-type=none
spring.datasource.url=jdbc:h2:file:${GOCHANG_DB_PATH:./data/gochang}
spring.datasource.hikari.read-only=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
gochang.migrate.mysql.url=${MYSQL_URL}
gochang.migrate.mysql.username=${MYSQL_USER}
gochang.migrate.mysql.password=${MYSQL_PASSWORD}
