# ---------------------------------------------------------------------------
# 운영 기본값. 1GB 서버에서 JVM 하나만 도는 것을 전제로 한다.
# 데이터: 읽기 전용 H2 파일. 파일은 배포 산출물이 아니라 서버에 한 번 두는 것이며 git 에 올리지 않는다.
# ---------------------------------------------------------------------------
spring.application.name=gochang

# H2 파일 DB. IFEXISTS=TRUE -> 파일이 없으면 빈 DB 를 만들지 않고 즉시 실패한다.
# ACCESS_MODE_DATA=r -> 파일을 읽기 전용으로 연다 (실수로도 못 고친다).
spring.datasource.url=jdbc:h2:file:${GOCHANG_DB_PATH:./data/gochang};IFEXISTS=TRUE;ACCESS_MODE_DATA=r
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.read-only=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# 프론트 계약: snake_case JSON
spring.jackson.property-naming-strategy=SNAKE_CASE

# 데이터가 바뀌지 않으므로 TTL 없이 크기만 제한한다. 오래 안 쓰인 항목은 6시간 뒤 비운다.
spring.cache.type=caffeine
spring.cache.cache-names=contentList,contentSearch,contentDetail,contentTitle,contentNeighbors,replies
spring.cache.caffeine.spec=maximumSize=1000,expireAfterAccess=6h,recordStats

# ?size=100000 으로 전체 덤프하는 것을 막는다
spring.data.web.pageable.default-page-size=15
spring.data.web.pageable.max-page-size=100

# 전송량: 본문이 텍스트라 gzip 효과가 크다 (nginx 가 앞에 있어도 무해)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html
server.compression.min-response-size=1024

# Java 21 가상 스레드: 플랫폼 스레드 풀 메모리를 줄인다
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# systemd / nginx 헬스체크용. 외부에는 nginx 가 /api/ 만 프록시하므로 노출되지 않는다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
